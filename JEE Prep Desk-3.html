<style>
/* Layout: sticky bar with a scrolling tab strip over one content column; cards flow into an auto-fit grid. Subject colours (Physics blue, Chemistry green, Maths orange) carry through every tab. */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --ink:#131C2B; --muted:#586577; --line:#D8DEE8;
  --accent:#2B3FB5; --accent-ink:#FFFFFF; --soft:#E8ECFA; --warn:#B3261E;
  --p:#1D6FD6; --c:#0A7F58; --m:#B85C0C;
  --pt:#E3EEFC; --ct:#DEF3EA; --mt:#FBEBDB;
  --h0:#E6EAF1; --h1:#C9D2F5; --h2:#9AABEF; --h3:#6479E0; --h4:#2B3FB5;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1522; --surface:#151F30; --ink:#E7EDF6; --muted:#96A3B6; --line:#25324A;
  --accent:#8EA0FF; --accent-ink:#0E1522; --soft:#1E2A4A; --warn:#FF8A80;
  --p:#5BA3F5; --c:#3DC48F; --m:#F09A47;
  --pt:#162B49; --ct:#12332A; --mt:#3A2A16;
  --h0:#1B2638; --h1:#26335F; --h2:#3A4C99; --h3:#5E73D6; --h4:#8EA0FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1522; --surface:#151F30; --ink:#E7EDF6; --muted:#96A3B6; --line:#25324A;
  --accent:#8EA0FF; --accent-ink:#0E1522; --soft:#1E2A4A; --warn:#FF8A80;
  --p:#5BA3F5; --c:#3DC48F; --m:#F09A47;
  --pt:#162B49; --ct:#12332A; --mt:#3A2A16;
  --h0:#1B2638; --h1:#26335F; --h2:#3A4C99; --h3:#5E73D6; --h4:#8EA0FF; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:1.35rem;letter-spacing:-.01em}
h2{font-size:1.1rem}
h3{font-size:1rem}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 4px;flex-wrap:wrap}
.sync{font-size:.78rem;color:var(--muted)}
nav#tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px}
nav#tabs button{font:inherit;font-weight:500;background:none;border:0;color:var(--muted);padding:8px 13px;border-radius:8px;cursor:pointer;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
nav#tabs button[aria-selected="true"]{background:var(--soft);color:var(--accent)}
nav#tabs button:hover{color:var(--ink)}
.badge{background:var(--warn);color:var(--surface);font-size:.68rem;font-weight:600;border-radius:99px;padding:0 6px;line-height:1.5}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

main#view{padding-block:20px 56px;display:flex;flex-direction:column;gap:16px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.grid.sm{grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr))}
.grid.md{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.grid>*{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card>header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{margin-left:auto}

.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{background:var(--warn);color:var(--surface);border-color:var(--warn)}
.btn.small{padding:4px 10px;font-size:.82rem}
.btn.ghost{border-color:transparent;color:var(--muted);background:none}
.btn.ghost:hover{color:var(--warn)}
.btn[aria-pressed="true"]{background:var(--soft);border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;max-width:100%}
textarea{width:100%;resize:vertical;min-height:84px;line-height:1.45}
input[type=checkbox]{accent-color:var(--accent);width:17px;height:17px;flex:none;margin:0}
form.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
form.inline label,.fld{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted);min-width:0}
form.inline label.grow,.fld.grow{flex:1 1 180px}
form.inline label.full{flex:1 1 100%}
form.inline label.num{width:84px}

.chip{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.chip.p{background:var(--pt);color:var(--p)} .chip.c{background:var(--ct);color:var(--c)} .chip.m{background:var(--mt);color:var(--m)}
.chip.g{background:var(--soft);color:var(--muted)}
.tag{font-size:.72rem;color:var(--muted);border:1px solid var(--line);padding:1px 8px;border-radius:99px;white-space:nowrap}
.tag.hi{color:var(--warn);border-color:var(--warn)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.bar.p>i{background:var(--p)} .bar.c>i{background:var(--c)} .bar.m>i{background:var(--m)}
.big{font-family:var(--f-display);font-weight:700;font-size:2.2rem;line-height:1;letter-spacing:-.02em}
.stat{display:flex;flex-direction:column;gap:8px}
.kpi{display:flex;flex-direction:column;gap:4px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-width:0}
.kpi .big{font-size:1.7rem}

.chap-card{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg);min-width:0}
.chap-card .chead{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.steps{display:flex;flex-direction:column;gap:6px}
.step{display:flex;gap:8px;align-items:center;cursor:pointer;font-size:.9rem}
.step input:checked+span{color:var(--muted);text-decoration:line-through}
.daycol{display:flex;flex-direction:column;gap:10px;min-width:0}
.daycol>header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.daycol.now>header h3{color:var(--accent)}
.empty{color:var(--muted);font-size:.9rem;padding:12px;border:1px dashed var(--line);border-radius:10px}
.note{font-size:.88rem;color:var(--muted);padding:10px 12px;border-radius:10px;background:var(--soft)}

.srow{display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:8px 2px}
.snm{font:inherit;color:var(--ink);background:none;border:0;text-align:left;cursor:pointer;flex:1;min-width:0;padding:2px;overflow-wrap:anywhere}
.snm:hover{color:var(--accent)}
.dots{display:inline-flex;gap:2px}
.dots i{width:6px;height:6px;border-radius:99px;background:var(--line)}
.dots i.on{background:var(--accent)}
.st{font:inherit;font-size:.74rem;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap;border:1px solid var(--line);color:var(--muted);background:none;cursor:pointer}
.st.s1{background:var(--soft);color:var(--accent);border-color:transparent}
.st.s2{background:var(--accent);color:var(--accent-ink);border-color:transparent}
div.st{cursor:default}
.detail{padding:12px;margin:4px 0 8px;border-radius:10px;background:var(--bg);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.seg{display:inline-flex;gap:4px;flex-wrap:wrap}

.task{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.task:last-child{border-bottom:0}
.task .tx{flex:1 1 140px;min-width:0;overflow-wrap:anywhere}
.task input:checked~.tx{color:var(--muted);text-decoration:line-through}
.over{color:var(--warn);font-size:.78rem;font-weight:600;white-space:nowrap}

.tdisp{font-family:var(--f-mono);font-size:3.2rem;font-weight:500;letter-spacing:.02em;line-height:1}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end}
.wk .col{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.wk .stackbar{height:110px;width:100%;max-width:34px;display:flex;flex-direction:column-reverse;border-radius:6px;overflow:hidden;background:var(--bg);border:1px solid var(--line)}
.wk .sg.p{background:var(--p)} .wk .sg.c{background:var(--c)} .wk .sg.m{background:var(--m)}
.wk .d{font-size:.72rem;color:var(--muted)}
.wk .v{font-size:.68rem;font-family:var(--f-mono);color:var(--ink)}
.sess{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sess:last-child{border-bottom:0}
.sess .when{flex:1 1 150px;min-width:0;color:var(--muted);font-size:.85rem;overflow-wrap:anywhere}

.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:460px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:.9rem;white-space:nowrap}
td.wrapc{white-space:normal;min-width:140px}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right}
svg.chart{display:block;width:100%;min-width:480px;height:auto}
svg.chart text{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
svg.chart .grid-l{stroke:var(--line);stroke-width:1}
svg.chart .ln{fill:none;stroke-width:2}
svg.chart .ln.s-t{stroke:var(--accent)} svg.chart .ln.s-p{stroke:var(--p)} svg.chart .ln.s-c{stroke:var(--c)} svg.chart .ln.s-m{stroke:var(--m)}
svg.chart .pt{stroke:var(--surface);stroke-width:2}
svg.chart .pt.s-t{fill:var(--accent)} svg.chart .pt.s-p{fill:var(--p)} svg.chart .pt.s-c{fill:var(--c)} svg.chart .pt.s-m{fill:var(--m)}
svg.chart text.val{fill:var(--ink)}
svg.chart .tg{stroke:var(--warn);stroke-dasharray:4 4;stroke-width:1.5}
svg.chart text.tgl{fill:var(--warn)}

.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);grid-auto-columns:13px;gap:3px;width:max-content}
.hc{border-radius:3px;background:var(--h0)}
.hc.l1{background:var(--h1)} .hc.l2{background:var(--h2)} .hc.l3{background:var(--h3)} .hc.l4{background:var(--h4)} .hc.no{background:transparent}
.legend{display:flex;gap:6px;align-items:center;font-size:.74rem;color:var(--muted)}
.legend .hc{width:13px;height:13px}
.hrow{display:flex;align-items:center;gap:10px}
.hrow .nm{flex:0 0 130px;font-size:.88rem;min-width:0;overflow-wrap:anywhere}
.hrow .bar{flex:1}
.hrow .v{flex:0 0 64px;text-align:right;font-size:.82rem}

.tt{display:flex;flex-direction:column;gap:8px;min-width:0}
.tt>header{display:flex;justify-content:space-between;align-items:baseline}
.tt.now h3{color:var(--accent)}
.blk{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);display:flex;flex-direction:column;gap:4px;min-width:0}
.blk .tm{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}

.notecard{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg);min-width:0}
.notecard .body{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.92rem}

.bubble{padding:10px 12px;border-radius:12px;max-width:100%;overflow-wrap:anywhere}
.bubble.u{background:var(--soft);align-self:flex-end;white-space:pre-wrap}
.bubble.a{background:var(--bg);border:1px solid var(--line);align-self:flex-start}
.bubble p{margin:0 0 6px} .bubble p:last-child{margin:0}
.bubble ul{margin:4px 0 6px;padding-left:20px}
.chat{display:flex;flex-direction:column;gap:10px}
kbd{font-family:var(--f-mono);font-size:.78rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;background:var(--bg)}
.badgebox{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;background:var(--bg)}
.badgebox.off{opacity:.55}

#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:.88rem;z-index:9;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
</style>

  <div class="wrap">

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const parseYmd=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);};
const dayDiff=(a,b)=>Math.round((parseYmd(a)-parseYmd(b))/864e5);
const addDays=(s,n)=>{const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d);};
const fmtDate=(s,o)=>parseYmd(s).toLocaleDateString('en-IN',o||{day:'numeric',month:'short'});
const fmtMin=m=>m>=60?Math.floor(m/60)+'h '+pad(m%60)+'m':m+'m';
const toMin=t=>{const a=(t||'0:0').split(':').map(Number);return a[0]*60+(a[1]||0);};
const wdIdx=s=>(parseYmd(s).getDay()+6)%7;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const SUBJ={P:{name:'Physics',cls:'p'},C:{name:'Chemistry',cls:'c'},M:{name:'Maths',cls:'m'}};
const SUBJOPTS=[['P','Physics'],['C','Chemistry'],['M','Maths']];
const SUBJOPTS_G=[['','General']].concat(SUBJOPTS);
const STEPS=['Theory and notes','Solved examples','Exercise problems','Previous year questions'];
const CAUSES=['Concept gap','Forgot formula','Calculation error','Silly mistake','Misread question','Time pressure','Guess'];
const SOURCES=['Mock test','PYQ','Chapter practice','Coaching test'];
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const STL=['Not started','Learning','Done'];
const REVINT=[1,3,7,21];
const ACTIVE_MIN=30;
const SYL={
 P:['Units and Measurements','Kinematics','Laws of Motion','Work, Power and Energy','Rotational Motion','Gravitation','Properties of Solids and Liquids','Thermodynamics','Kinetic Theory of Gases','Oscillations and Waves','Electrostatics','Current Electricity','Magnetism and Moving Charges','EMI and AC','Electromagnetic Waves','Ray and Wave Optics','Dual Nature of Matter','Atoms and Nuclei','Semiconductors'],
 C:['Mole Concept','Atomic Structure','Periodic Table','Chemical Bonding','Chemical Thermodynamics','Chemical Equilibrium','Redox Reactions','Solutions','Electrochemistry','Chemical Kinetics','d and f Block Elements','Coordination Compounds','General Organic Chemistry','Hydrocarbons','Haloalkanes and Haloarenes','Alcohols, Phenols and Ethers','Aldehydes and Ketones','Amines','Biomolecules'],
 M:['Sets, Relations and Functions','Complex Numbers','Quadratic Equations','Linear Inequalities','Permutations and Combinations','Binomial Theorem','Sequence and Series','Trigonometry','Straight Lines','Circles and Conic Sections','Limits and Continuity','Differentiability and Derivatives','Application of Derivatives','Integrals','Differential Equations','Matrices and Determinants','Vectors and 3D Geometry','Probability']
};
const ALLC=[];['P','C','M'].forEach(s=>SYL[s].forEach(n=>ALLC.push({n:n,s:s})));
const subjOf=n=>{const c=ALLC.find(x=>x.n===n);return c?c.s:'';};
const TABS=[['today','Today'],['plan','Plan'],['syllabus','Syllabus'],['revise','Revise'],['mistakes','Mistakes'],['study','Study'],['week','Timetable'],['tests','Mock tests'],['teacher','Teacher report'],['notes','Notes'],['insights','Insights'],['coach','Coach'],['data','Data']];

const mk=(name,subj,syl,day)=>({id:uid(),name:name,subj:subj,syl:syl,day:day,steps:[false,false,false,false]});
const blk=(day,start,end,subj,label)=>({id:uid(),day:day,start:start,end:end,subj:subj,label:label,sample:true});
function starterBlocks(){
  const out=[],rot=['P','C','M'];
  for(let d=0;d<6;d++){const r=[rot[d%3],rot[(d+1)%3],rot[(d+2)%3]];
    out.push(blk(d,'06:00','08:00',r[0],'Concepts and problems'),blk(d,'09:00','11:00',r[1],'Theory and numericals'),blk(d,'17:00','19:00',r[2],'Practice sets'));}
  out.push(blk(6,'09:00','12:00','','Full mock test'),blk(6,'15:00','17:00','','Test analysis and revision'));
  return out;
}
function DEFAULT(){return {
  v:2, planStart:'2026-10-05', examDate:'', goalMins:360, targetScore:'', theme:'system', student:'',
  backlog:[
    mk('Chemical Bonding','C','Chemical Bonding',1),
    mk('NLM with friction','P','Laws of Motion',2),
    mk('Complex Numbers','M','Complex Numbers',3),
    mk('Linear Inequalities','M','Linear Inequalities',3),
    mk('Redox Reactions','C','Redox Reactions',4),
    mk('Sequence and Series','M','Sequence and Series',4),
    mk('Work Power Energy','P','Work, Power and Energy',5)
  ],
  syl:{}, chap:{}, doneOn:{}, rev:[], tasks:[], sessions:[], tests:[], mistakes:[], qlog:[],
  blocks:starterBlocks(),
  habits:[{id:'h1',name:'Sleep 7+ hours'},{id:'h2',name:'Exercise or a walk'},{id:'h3',name:'Revise formulas'}],
  hlog:{}, notes:[]
};}
const ARRK=['backlog','rev','tasks','sessions','tests','mistakes','qlog','blocks','habits','notes'];
const OBJK=['syl','chap','doneOn','hlog'];
function norm(x){
  const d=DEFAULT();if(!x||typeof x!=='object')return d;
  Object.keys(x).forEach(k=>{if(x[k]!==undefined&&x[k]!==null)d[k]=x[k];});
  ARRK.forEach(k=>{if(!Array.isArray(d[k]))d[k]=DEFAULT()[k];});
  OBJK.forEach(k=>{if(!d[k]||typeof d[k]!=='object'||Array.isArray(d[k]))d[k]={};});
  return d;
}

const KEY='jee-prep-desk-v1';
let S=DEFAULT(),tab='today',refA=null,refB=null,saveTimer=null,saving=false,pendingSave=false,lastA='',lastB='';
let openChap='',sylQ='',sylSt='',sylPr='',noteQ='',editNote='',mfS='',mfC='',mfT='open',tDay=today();
let coachTurns=[],coachBusy=false,coachErr='',coachDraft='',coachCtl=null,SAMPLE=null,DL=null;
let importPending=null,resetArm=false,wake=null;
try{const raw=localStorage.getItem(KEY);if(raw)S=norm(JSON.parse(raw));}catch(e){}
try{let h=(location.hash||'').slice(1);if(h==='backlog')h='plan';if(TABS.some(t=>t[0]===h))tab=h;}catch(e){}

function setSync(t){const el=$('#sync');if(el)el.textContent=t;}
function compactSessions(){
  if(S.sessions.length<=700)return;
  const cut=addDays(today(),-120),keep=[],old={};
  S.sessions.forEach(x=>{if(x.date>=cut)keep.push(x);else{const k=x.date+'|'+x.subj;if(old[k])old[k].mins+=x.mins;else old[k]={id:uid(),date:x.date,subj:x.subj,mins:x.mins,at:x.at,chap:'',note:'',dist:0};}});
  S.sessions=Object.keys(old).map(k=>old[k]).concat(keep);
}
function splitState(){const a=Object.assign({},S);const logs={sessions:S.sessions,notes:S.notes,qlog:S.qlog};delete a.sessions;delete a.notes;delete a.qlog;return [a,logs];}
function save(){
  compactSessions();
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  setSync('Saving...');clearTimeout(saveTimer);saveTimer=setTimeout(flush,700);
}
async function flush(){
  if(!refA){setSync('Saved in this browser only');return;}
  if(saving){pendingSave=true;return;}
  saving=true;
  try{
    const parts=splitState(),a=JSON.stringify(parts[0]),b=JSON.stringify(parts[1]);
    if(a!==lastA){await refA.set({s:parts[0],updated:Date.now()});lastA=a;}
    if(b!==lastB){await refB.set({s:parts[1],updated:Date.now()});lastB=b;}
    setSync('Saved to your account');
  }catch(e){setSync(e&&e.code==='invalid_argument'?'Too large to sync. Saved in this browser':'Saved in this browser only');}
  finally{saving=false;if(pendingSave){pendingSave=false;flush();}}
}

/* ---------- derived data ---------- */
const stepsDone=b=>b.steps.filter(Boolean).length;
const blFor=name=>S.backlog.find(x=>x.syl===name);
function getStatus(name){const b=blFor(name);if(b){const n=stepsDone(b);return n===4?2:(n>0?1:0);}return S.syl[name]||0;}
const meta=name=>Object.assign({conf:0,prio:'',notes:''},S.chap[name]);
function setMeta(name,p){S.chap[name]=Object.assign(meta(name),p);}
function scheduleRev(name,subj){
  if(S.rev.some(r=>r.name===name&&!r.done))return;
  const t=today();REVINT.forEach((iv,i)=>S.rev.push({id:uid(),name:name,subj:subj||subjOf(name),due:addDays(t,iv),n:i+1,done:false}));
}
function markDone(name,subj){S.doneOn[name]=today();scheduleRev(name,subj);}
const dueRevs=()=>{const t=today();return S.rev.filter(r=>!r.done&&r.due<=t).sort((a,b)=>a.due<b.due?-1:1);};
function minsOn(d){const o={P:0,C:0,M:0,tot:0};S.sessions.forEach(x=>{if(x.date===d){o[x.subj]=(o[x.subj]||0)+x.mins;o.tot+=x.mins;}});return o;}
function minsMap(){const m={};S.sessions.forEach(x=>{m[x.date]=(m[x.date]||0)+x.mins;});return m;}
function streak(){
  const m=minsMap(),act=d=>(m[d]||0)>=ACTIVE_MIN,t=today();
  let d=act(t)?t:addDays(t,-1),cur=0;while(act(d)){cur++;d=addDays(d,-1);}
  const keys=Object.keys(m).sort();let best=0;
  if(keys.length){let run=0,x=keys[0];const end=t;while(x<=end){if(act(x)){run++;if(run>best)best=run;}else run=0;x=addDays(x,1);}}
  return {cur:cur,best:Math.max(best,cur)};
}
function habitStreak(id){
  const t=today();let d=(S.hlog[t]||[]).includes(id)?t:addDays(t,-1),n=0;
  while((S.hlog[d]||[]).includes(id)){n++;d=addDays(d,-1);}return n;
}
const totalMins=()=>S.sessions.reduce((a,x)=>a+x.mins,0);
function lastStudied(name){let l='';S.sessions.forEach(x=>{if(x.chap===name&&x.date>l)l=x.date;});return l;}
function chapMins(){const m={};S.sessions.forEach(x=>{if(x.chap)m[x.chap]=(m[x.chap]||0)+x.mins;});return m;}
const testTotal=x=>x.p+x.c+x.m;
function pace(){
  const t=today(),done=ALLC.filter(c=>getStatus(c.n)===2).length,remaining=ALLC.length-done;
  const cut=addDays(t,-14);const recent=Object.keys(S.doneOn).filter(n=>S.doneOn[n]>=cut).length;
  const perWeek=recent/2;
  const left=S.examDate?dayDiff(S.examDate,t):null;
  return {done:done,remaining:remaining,perWeek:perWeek,left:left,need:left!==null&&left>0?remaining/(left/7):null,weeksAtPace:perWeek>0?remaining/perWeek:null};
}
function badges(){
  const tot=totalMins(),st=streak().best,done=ALLC.filter(c=>getStatus(c.n)===2).length;
  const rv=S.rev.filter(r=>r.done).length,fx=S.mistakes.filter(m=>m.status==='fixed').length;
  return [
    {n:'First session',d:'Log a study session',ok:S.sessions.length>0},
    {n:'10 hours',d:'Study 10 hours in total',ok:tot>=600},
    {n:'50 hours',d:'Study 50 hours in total',ok:tot>=3000},
    {n:'100 hours',d:'Study 100 hours in total',ok:tot>=6000},
    {n:'7-day streak',d:'Study '+ACTIVE_MIN+'+ minutes seven days running',ok:st>=7},
    {n:'First chapter cleared',d:'Mark one chapter Done',ok:done>=1},
    {n:'Backlog cleared',d:'Finish every backlog chapter',ok:S.backlog.length>0&&S.backlog.every(b=>stepsDone(b)===4)},
    {n:'First mock test',d:'Log a mock test score',ok:S.tests.length>0},
    {n:'25 revisions',d:'Complete 25 scheduled revisions',ok:rv>=25},
    {n:'10 mistakes fixed',d:'Mark ten mistakes as fixed',ok:fx>=10}
  ];
}

/* timer */
const T={mode:'focus',subj:'P',mins:25,lens:{short:5,long:15},running:false,end:0,left:25*60,chap:'',note:'',dist:0,cycle:0};
const tLen=()=>(T.mode==='focus'?T.mins:T.lens[T.mode])*60;
const tLeft=()=>T.running?Math.max(0,Math.round((T.end-Date.now())/1000)):T.left;
function updTimer(){const d=$('#tdisp');if(!d)return;const l=tLeft();d.textContent=pad(Math.floor(l/60))+':'+pad(l%60);const b=$('#tbar');if(b)b.style.width=(100-l/tLen()*100)+'%';}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.08;o.start();setTimeout(()=>{o.stop();a.close();},350);}catch(e){}}
async function lockScreen(on){try{if(on&&navigator.wakeLock&&!wake){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>{wake=null;});}else if(!on&&wake){await wake.release();wake=null;}}catch(e){wake=null;}}
function logSession(mins){
  if(mins<1)return false;
  S.sessions.push({id:uid(),date:today(),subj:T.subj,mins:mins,at:Date.now(),chap:T.chap,note:T.note.trim(),dist:T.dist});
  save();return true;
}
function resetTimer(){T.running=false;T.left=tLen();T.dist=0;lockScreen(false);}
function nextMode(){T.cycle++;T.mode=T.cycle%4===0?'long':'short';}
setInterval(()=>{
  if(!T.running)return;
  if(tLeft()<=0){
    T.running=false;
    if(T.mode==='focus'){logSession(T.mins);toast('Session logged: '+T.mins+' min of '+SUBJ[T.subj].name+'. Take a break.');T.note='';nextMode();}
    else{toast('Break over. Ready for the next session.');T.mode='focus';}
    T.dist=0;T.left=tLen();lockScreen(false);beep();
    if(tab==='study'||tab==='today')render();
  }else updTimer();
},500);

function lineChart(o){
  const W=560,H=240,L=40,R=22,Tp=22,B=30,n=o.labels.length;
  const X=i=>L+i*(W-L-R)/(n-1),Y=v=>Tp+(o.hi-v)*(H-Tp-B)/(o.hi-o.lo);
  let g='';for(let v=o.lo;v<=o.hi;v+=o.step)g+='<line class="grid-l" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text x="'+(L-8)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+v+'</text>';
  const sx=Math.ceil(n/8);let lines='',dots='';
  o.series.forEach(s=>{lines+='<polyline class="ln '+s.cls+'" points="'+s.vals.map((v,i)=>X(i)+','+Y(v)).join(' ')+'"/>';
    s.vals.forEach((v,i)=>{dots+='<circle class="pt '+s.cls+'" cx="'+X(i)+'" cy="'+Y(v)+'" r="4.5"/>';if(o.vl==='all'||(o.vl==='last'&&i===n-1))dots+='<text class="val" x="'+X(i)+'" y="'+(Y(v)-9)+'" text-anchor="middle">'+v+'</text>';});});
  const xl=o.labels.map((l,i)=>i%sx===0?'<text x="'+X(i)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(l)+'</text>':'').join('');
  const tg=(o.target!=null&&o.target>=o.lo&&o.target<=o.hi)?'<line class="tg" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(o.target)+'" y2="'+Y(o.target)+'"/><text class="tgl" x="'+(W-R)+'" y="'+(Y(o.target)-5)+'" text-anchor="end">target '+o.target+'</text>':'';
  return '<div class="scroll"><svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.aria)+'">'+g+tg+lines+dots+xl+'</svg></div>';
}

      '<section class="card stack"><header><h2>By subject</h2><span class="row"><span class="chip p">Physics</span><span class="chip c">Chemistry</span><span class="chip m">Maths</span></span></header>'+lineChart({labels:labels,series:[{vals:ts.map(x=>x.p),cls:'s-p'},{vals:ts.map(x=>x.c),cls:'s-c'},{vals:ts.map(x=>x.m),cls:'s-m'}],lo:lo2,hi:100,step:25,vl:'last',aria:'Mock test subject scores out of 100 over time'})+'</section></div>';
  }else charts='<section class="card"><div class="empty">'+(ts.length?'Add one more test to see the trend lines.':'No mock tests logged yet. Add your first score below.')+'</div></section>';

  const table='<section class="card stack"><header><h2>Test log</h2><form class="inline"><label>Target total<input type="number" id="f-target" data-change="target" min="1" max="300" step="1" style="width:110px" value="'+esc(S.targetScore)+'" placeholder="out of 300"></label></form></header>'+
    (ts.length?'<div class="scroll"><table><thead><tr><th>Date</th><th>Test</th><th class="n">Physics</th><th class="n">Chem</th><th class="n">Maths</th><th class="n">Total</th><th>Analysis</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>':'<p class="muted">Scores are out of 100 per subject.</p>')+

    '<label class="full">Analysis<input type="text" id="f-test-note" maxlength="200" placeholder="Lost marks on rotational motion and rushed Maths"></label><button class="btn primary" type="submit">Add test</button></form></section>';

/* ---------- teacher report ---------- */
function dayReport(d){
  const qs=S.qlog.filter(q=>q.date===d).sort((a,b)=>a.at-b.at);
  const bySub={P:0,C:0,M:0},chap={};let tot=0,cor=0,corN=0;
  qs.forEach(q=>{
    bySub[q.subj]=(bySub[q.subj]||0)+q.count;tot+=q.count;
    if(q.correct!=null){cor+=q.correct;corN+=q.count;}
    if(q.chap){chap[q.chap]=chap[q.chap]||{q:0,m:0};chap[q.chap].q+=q.count;}
  });
  S.sessions.filter(x=>x.date===d&&x.chap).forEach(x=>{chap[x.chap]=chap[x.chap]||{q:0,m:0};chap[x.chap].m+=x.mins;});
  return {date:d,qs:qs,tot:tot,bySub:bySub,cor:cor,corN:corN,chap:chap,mins:minsOn(d),
    revs:S.rev.filter(r=>r.done&&r.doneOn===d),
    tests:S.tests.filter(x=>x.date===d),
    mistakes:S.mistakes.filter(m=>m.date===d)};
}

    cells+='<i class="hc l'+l+'" title="'+esc(fmtDate(d,{day:'numeric',month:'short'})+': '+fmtMin(v))+'"></i>';}

const inl=s=>s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
function md(t){const lines=esc(t).split('\n');let out='',ul=false;lines.forEach(l=>{const m=l.match(/^\s*[-*]\s+(.*)$/);if(m){if(!ul){out+='<ul>';ul=true;}out+='<li>'+inl(m[1])+'</li>';}else{if(ul){out+='</ul>';ul=false;}if(l.trim())out+='<p>'+inl(l.replace(/^#+\s*/,''))+'</p>';}});if(ul)out+='</ul>';return out;}
function coachCtx(){
  const t=today(),L=[];
  L.push('Today: '+t+' ('+new Date().toLocaleDateString('en-IN',{weekday:'long'})+')');
  if(S.examDate)L.push('Exam date: '+S.examDate+' ('+dayDiff(S.examDate,t)+' days left)');
  L.push('Daily study goal: '+(S.goalMins/60)+' hours');
  if(S.targetScore)L.push('Target mock total: '+S.targetScore+' out of 300');
  const done=ALLC.filter(c=>getStatus(c.n)===2).length,learn=ALLC.filter(c=>getStatus(c.n)===1).map(c=>c.n);
  L.push('Syllabus: '+done+' of '+ALLC.length+' chapters done'+(learn.length?'; in progress: '+learn.join(', '):''));
  const bl=S.backlog.filter(b=>stepsDone(b)<4).map(b=>b.name+' ('+SUBJ[b.subj].name+', plan day '+b.day+', '+stepsDone(b)+'/4 steps)');
  L.push('Open backlog: '+(bl.join('; ')||'none')+'. Plan starts '+S.planStart+'.');
  const weak=ALLC.filter(c=>{const m=meta(c.n);return m.conf>0&&m.conf<=2;}).map(c=>c.n+' (confidence '+meta(c.n).conf+'/5)');
  if(weak.length)L.push('Low-confidence chapters: '+weak.join(', '));
  const hi=ALLC.filter(c=>meta(c.n).prio==='High'&&getStatus(c.n)<2).map(c=>c.n);
  if(hi.length)L.push('High-priority chapters not done: '+hi.join(', '));
  const due=dueRevs();L.push('Revisions due or overdue: '+due.length+(due.length?' ('+due.slice(0,8).map(r=>r.name).join(', ')+')':''));
  const days=[];for(let i=6;i>=0;i--)days.push(minsOn(addDays(t,-i)));
  L.push('Study minutes, last 7 days (oldest first): '+days.map(o=>o.tot).join(', ')+'. By subject: Physics '+days.reduce((a,o)=>a+o.P,0)+', Chemistry '+days.reduce((a,o)=>a+o.C,0)+', Maths '+days.reduce((a,o)=>a+o.M,0)+'.');
  const qn=S.qlog.filter(q=>q.date>=addDays(t,-6)).reduce((a,q)=>a+q.count,0);
  L.push('Questions solved, last 7 days: '+qn+'.');
  const ts=S.tests.slice().sort((a,b)=>a.date<b.date?-1:1).slice(-5);
  if(ts.length)L.push('Recent mock tests (Physics/Chemistry/Maths/total): '+ts.map(x=>x.date+' '+x.p+'/'+x.c+'/'+x.m+'/'+testTotal(x)).join('; '));
  const om=S.mistakes.filter(m=>m.status!=='fixed');
  if(om.length){const c={};om.forEach(m=>{c[m.cause]=(c[m.cause]||0)+1;});L.push('Open mistakes by cause: '+Object.keys(c).map(k=>k+' '+c[k]).join(', ')+'. Latest: '+om.slice(-3).map(m=>m.text.slice(0,80)).join(' | '));}
  const wd=wdIdx(t),tb=S.blocks.filter(b=>b.day===wd).sort((a,b)=>toMin(a.start)-toMin(b.start));
  if(tb.length)L.push("Today's timetable: "+tb.map(b=>b.start+'-'+b.end+' '+(b.subj?SUBJ[b.subj].name:'')+' '+b.label).join('; '));
  const ot=S.tasks.filter(x=>!x.done).slice(0,8).map(x=>x.text);if(ot.length)L.push('Open tasks: '+ot.join('; '));
  return L.join('\n');
}
const RULES='You are a study coach for a JEE aspirant (the Indian engineering entrance exam) who uses a personal prep tracker. Use only the tracker data below. Do not invent scores, dates, chapters or study history that is not in it, and say what is missing when it matters. Be specific and practical: name chapters, give times in hours and minutes, and order actions by priority. Keep answers under 250 words in plain text, using short lines that start with "- " for lists and **bold** for key words. No tables and no headings.\n\nTRACKER DATA\n';
const COACH_ERR={not_granted:'Coach is not allowed for this page. Allow Claude access when prompted to use it.',sampling_disabled:'Claude is not available for this account.',rate_limited:'Too many requests or your usage limit is reached. Try again in a while.',session_expired:'Please sign in again, then retry.',refused:'Claude could not answer that. Try rephrasing.',empty_completion:'No answer came back. Try asking in a different way.',upstream_error:'The connection dropped. Try again.',prompt_too_large:'Too much data to send. Clear some old notes or logs.'};
async function askCoach(text){
  if(!SAMPLE||coachBusy||!text.trim())return;
  coachTurns.push({role:'user',content:text.trim()});if(coachTurns.length>10)coachTurns=coachTurns.slice(-10);
  while(coachTurns.length&&coachTurns[0].role!=='user')coachTurns.shift();
  coachBusy=true;coachErr='';coachDraft='';coachCtl=new AbortController();render();
  const input=[{role:'user',content:RULES+coachCtx()}].concat(coachTurns);
  try{
    const r=await SAMPLE(input,{cache:false,signal:coachCtl.signal,onText:u=>{const el=$('#coach-live');if(el)el.innerHTML=md(u.text);}});
    coachTurns.push({role:'assistant',content:r.text});if(r.truncated)coachErr='The answer was cut short. Ask for less at a time.';
  }catch(e){
    if(e&&e.text&&e.code!=='refused')coachTurns.push({role:'assistant',content:e.text});
    if(!e||e.code!=='cancelled')coachErr=COACH_ERR[e&&e.code]||COACH_ERR.upstream_error;
    if(e&&e.code==='not_granted'||e&&e.code==='sampling_disabled')SAMPLE=null;
  }finally{coachBusy=false;coachCtl=null;if(tab==='coach')render();}
}

  const live=coachBusy?'<div class="bubble a" id="coach-live"><span class="muted">Thinking...</span></div>':'';

  const th=['system','light','dark'].map(k=>'<button type="button" class="btn small" data-act="settheme" data-t="'+k+'" aria-pressed="'+((S.theme||'system')===k)+'">'+k.charAt(0).toUpperCase()+k.slice(1)+'</button>').join('');
  const imp=importPending?'<div class="note stack"><span>This file has '+(importPending.backlog||[]).length+' backlog chapters, '+(importPending.sessions||[]).length+' sessions, '+(importPending.tests||[]).length+' mock tests and '+(importPending.mistakes||[]).length+' mistakes. Importing replaces everything you have now.</span><div class="row"><button type="button" class="btn danger" data-act="importgo">Replace my data</button><button type="button" class="btn" data-act="importcancel">Cancel</button></div></div>':'';
  const reset=resetArm?'<div class="note stack"><span>This deletes all your plans, logs, notes and settings on this page. Export a backup first if you might want them back.</span><div class="row"><button type="button" class="btn danger" data-act="resetgo">Delete everything</button><button type="button" class="btn" data-act="resetcancel">Cancel</button></div></div>':'<button type="button" class="btn" data-act="resetarm">Reset all data</button>';
  return '<div class="grid"><section class="card stack"><header><h2>Settings</h2></header><div class="row"><span class="label">Theme</span><span class="seg">'+th+'</span></div>'+
    '<form class="inline"><label>Daily goal (hours)<input type="number" id="f-goal" data-change="goal" min="1" max="16" step="0.5" value="'+(S.goalMins/60)+'" style="width:110px"></label><label>Exam date<input type="date" id="f-exam" data-change="exam" value="'+esc(S.examDate)+'"></label><label>Target total<input type="number" id="f-target" data-change="target" min="1" max="300" step="1" value="'+esc(S.targetScore)+'" style="width:110px" placeholder="of 300"></label><label>Backlog plan starts<input type="date" id="f-plan-start" data-change="planstart" value="'+esc(S.planStart)+'"></label></form></section>'+
    '<section class="card stack"><header><h2>Backup and export</h2></header><p class="muted">Your data is saved to your account automatically. A backup file lets you move it or keep a copy.</p><div class="row"><button type="button" class="btn primary" data-act="export"'+(DL?'':' disabled')+'>Export backup (JSON)</button><button type="button" class="btn" data-act="csvs"'+(DL?'':' disabled')+'>Study log (CSV)</button><button type="button" class="btn" data-act="csvt"'+(DL?'':' disabled')+'>Mock tests (CSV)</button><button type="button" class="btn" data-act="csvm"'+(DL?'':' disabled')+'>Mistakes (CSV)</button><button type="button" class="btn" data-act="csvq"'+(DL?'':' disabled')+'>Questions (CSV)</button></div>'+
    '<label class="fld">Import a backup<input type="file" id="f-import" accept=".json,application/json" data-change="import"></label>'+imp+'</section></div>'+
    '<div class="grid"><section class="card stack"><header><h2>Keyboard</h2></header><div class="stack"><span><kbd>1</kbd> to <kbd>9</kbd> and <kbd>0</kbd> jump between the first ten tabs</span><span><kbd>t</kbd> starts or pauses the timer on the Study tab</span></div></section>'+
    '<section class="card stack"><header><h2>Danger zone</h2></header>'+reset+'</section></div>';
}

/* ---------- render + events ---------- */
const VIEWS={today:viewToday,plan:viewPlan,syllabus:viewSyllabus,revise:viewRevise,mistakes:viewMistakes,study:viewStudy,week:viewWeek,tests:viewTests,teacher:viewTeacher,notes:viewNotes,insights:viewInsights,coach:viewCoach,data:viewData};
function applyTheme(){
  const t=S.theme||'system',r=document.documentElement;
  if(t==='light'||t==='dark')r.setAttribute('data-theme',t);else r.removeAttribute('data-theme');
  $('#theme').textContent='Theme: '+({system:'System',light:'Light',dark:'Dark'}[t]||'System');
}
function updBadges(){const el=$('#bd-rev');if(!el)return;const n=dueRevs().length;el.textContent=n;el.hidden=!n;}
function render(){
  const ae=document.activeElement,fk=ae&&ae.dataset?ae.dataset.fk:null;
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));
  let html;try{html=VIEWS[tab]();}catch(e){html='<section class="card stack"><h2>Something went wrong on this tab</h2><p class="muted">'+esc(e&&e.message)+'</p></section>';}
  $('#view').innerHTML=html+'<datalist id="dl-chaps">'+ALLC.map(c=>'<option value="'+esc(c.n)+'"></option>').join('')+'</datalist>';
  updTimer();updBadges();
  if(fk){const el=document.querySelector('[data-fk="'+fk+'"]');if(el)el.focus();}
}
function setTab(t){tab=t;try{history.replaceState(null,'','#'+t);}catch(e){}render();window.scrollTo(0,0);}
$('#tabs').innerHTML=TABS.map(t=>'<button type="button" data-tab="'+t[0]+'">'+t[1]+(t[0]==='revise'?'<span class="badge" id="bd-rev" hidden></span>':'')+'</button>').join('');
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(b)setTab(b.dataset.tab);});
$('#theme').addEventListener('click',()=>{const o=['system','light','dark'];S.theme=o[(o.indexOf(S.theme||'system')+1)%3];applyTheme();save();if(tab==='data')render();});

const find=(arr,id)=>arr.find(x=>x.id===id);
const view=$('#view');
view.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;const d=el.dataset;let x;
  switch(d.act){
    case 'gostudy':setTab('study');break;
    case 'gorev':setTab('revise');break;
    case 'gowk':setTab('week');break;
    case 'delbl':S.backlog=S.backlog.filter(b=>b.id!==d.id);save();render();break;
    case 'sopen':{const n=ALLC[+d.ci].n;openChap=openChap===n?'':n;render();break;}
    case 'scycle':{const c=ALLC[+d.ci],ns=((S.syl[c.n]||0)+1)%3;S.syl[c.n]=ns;if(ns===2)markDone(c.n,c.s);else delete S.doneOn[c.n];save();render();break;}
    case 'setst':{const c=ALLC[+d.ci],ns=+d.st;S.syl[c.n]=ns;if(ns===2)markDone(c.n,c.s);else delete S.doneOn[c.n];save();render();break;}
    case 'conf':{const c=ALLC[+d.ci],m=meta(c.n),v=+d.v;setMeta(c.n,{conf:m.conf===v?0:v});save();render();break;}
    case 'schedrev':{const c=ALLC[+d.ci];const had=S.rev.some(r=>r.name===c.n&&!r.done);scheduleRev(c.n,c.s);save();render();toast(had?'Revisions are already scheduled':'Revisions scheduled');break;}
    case 'deltask':S.tasks=S.tasks.filter(t=>t.id!==d.id);save();render();break;
    case 'tfocus':x=find(S.tasks,d.id);if(x){x.pri=!x.pri;save();render();}break;
    case 'delhab':S.habits=S.habits.filter(h=>h.id!==d.id);save();render();break;
    case 'delsess':S.sessions=S.sessions.filter(s=>s.id!==d.id);save();render();break;
    case 'deltest':S.tests=S.tests.filter(s=>s.id!==d.id);save();render();break;
    case 'delmist':S.mistakes=S.mistakes.filter(s=>s.id!==d.id);save();render();break;
    case 'delq':S.qlog=S.qlog.filter(q=>q.id!==d.id);save();render();break;
    case 'fixmist':x=find(S.mistakes,d.id);if(x){x.status=x.status==='fixed'?'open':'fixed';save();render();}break;
    case 'askcoach':x=find(S.mistakes,d.id);if(x){coachDraft='Explain why I made this mistake and how to avoid it next time: '+x.text+' (cause: '+x.cause+(x.chap?', chapter: '+x.chap:'')+').';setTab('coach');}break;
    case 'delblock':S.blocks=S.blocks.filter(b=>b.id!==d.id);save();render();break;
    case 'clrsample':S.blocks=S.blocks.filter(b=>!b.sample);save();render();break;
    case 'delnote':S.notes=S.notes.filter(n=>n.id!==d.id);if(editNote===d.id)editNote='';save();render();break;
    case 'pinnote':x=find(S.notes,d.id);if(x){x.pin=!x.pin;save();render();}break;
    case 'editnote':editNote=d.id;render();window.scrollTo(0,0);break;
    case 'cancelnote':editNote='';render();break;
    case 'revok':x=find(S.rev,d.id);if(x){x.done=true;x.doneOn=today();const m=meta(x.name);setMeta(x.name,{conf:Math.min(5,Math.max(m.conf,2)+1)});save();render();}break;
    case 'revshaky':x=find(S.rev,d.id);if(x){x.done=true;x.doneOn=today();const m=meta(x.name);setMeta(x.name,{conf:Math.min(m.conf||2,2)});S.rev.push({id:uid(),name:x.name,subj:x.subj,due:addDays(today(),2),n:x.n,done:false});save();render();toast('Back in two days');}break;
    case 'delrev':S.rev=S.rev.filter(r=>r.id!==d.id);save();render();break;
    case 'tsubj':T.subj=d.s;T.chap='';render();break;
    case 'tmode':if(!T.running){T.mode=d.m;T.left=tLen();T.dist=0;}render();break;
    case 'preset':T.mins=+d.min;if(!T.running&&T.mode==='focus')T.left=tLen();render();break;
    case 'tstart':if(T.left<=0)T.left=tLen();T.end=Date.now()+T.left*1000;T.running=true;lockScreen(true);render();break;
    case 'tpause':T.left=tLeft();T.running=false;lockScreen(false);render();break;
    case 'treset':resetTimer();render();break;
    case 'tskip':T.mode='focus';resetTimer();render();break;
    case 'tdist':T.dist++;render();break;
    case 'tstop':{const em=Math.round((tLen()-tLeft())/60);if(logSession(em)){toast('Session logged: '+em+' min of '+SUBJ[T.subj].name);T.note='';}else toast('Under a minute, nothing logged');resetTimer();render();break;}
    case 'cq':{const q={plan:'Plan my study day for today. Use my open backlog, due revisions, timetable and daily goal. Give a time-blocked plan.',weak:'Analyse my weak spots from my confidence ratings, mock scores and mistake log, and tell me what to fix first.',week:'Make a 7-day plan from today to clear my open backlog and revise my low-confidence chapters.'}[d.q];askCoach(q);break;}
    case 'csend':askCoach(coachDraft);break;
    case 'cstop':if(coachCtl)coachCtl.abort();break;
    case 'cclear':coachTurns=[];coachErr='';render();break;
    case 'tcopy':copyText(reportText(dayReport(tDay)));break;
    case 'tdl':saveFile('study-report-'+tDay+'.html',reportDoc(dayReport(tDay)));break;
    case 'settheme':S.theme=d.t;applyTheme();save();render();break;
    case 'export':saveFile('jee-prep-desk-backup-'+today()+'.json',JSON.stringify(S,null,2));break;
    case 'csvs':saveFile('study-log-'+today()+'.csv',toCsv([['date','subject','minutes','chapter','note','distractions']].concat(S.sessions.map(s=>[s.date,SUBJ[s.subj]?SUBJ[s.subj].name:s.subj,s.mins,s.chap||'',s.note||'',s.dist||0]))));break;
    case 'csvt':saveFile('mock-tests-'+today()+'.csv',toCsv([['date','test','physics','chemistry','maths','total','analysis']].concat(S.tests.map(s=>[s.date,s.name,s.p,s.c,s.m,testTotal(s),s.note||'']))));break;
    case 'csvm':saveFile('mistakes-'+today()+'.csv',toCsv([['date','subject','chapter','cause','source','status','what went wrong','fix']].concat(S.mistakes.map(m=>[m.date,SUBJ[m.subj]?SUBJ[m.subj].name:m.subj,m.chap||'',m.cause,m.source,m.status||'open',m.text,m.fix||'']))));break;
    case 'csvq':saveFile('questions-'+today()+'.csv',toCsv([['date','subject','chapter','solved','correct','note']].concat(S.qlog.map(q=>[q.date,SUBJ[q.subj]?SUBJ[q.subj].name:q.subj,q.chap||'',q.count,q.correct==null?'':q.correct,q.note||'']))));break;
    case 'importgo':if(importPending){S=norm(importPending);importPending=null;applyTheme();save();render();toast('Backup imported');}break;
    case 'importcancel':importPending=null;render();break;
    case 'resetarm':resetArm=true;render();break;
    case 'resetcancel':resetArm=false;render();break;
    case 'resetgo':S=DEFAULT();resetArm=false;openChap='';tDay=today();applyTheme();save();render();toast('All data cleared');break;
  }
});
view.addEventListener('change',e=>{
  const el=e.target.closest('[data-change]');if(!el)return;const d=el.dataset;let x;
  switch(d.change){
    case 'step':x=find(S.backlog,d.id);if(x){const was=stepsDone(x)===4;x.steps[+d.i]=el.checked;const now=stepsDone(x)===4;const nm=x.syl||x.name;if(now&&!was){markDone(nm,x.subj);toast('Chapter cleared. Revisions scheduled.');}else if(was&&!now)delete S.doneOn[nm];save();render();}break;
    case 'day':x=find(S.backlog,d.id);if(x){x.day=+el.value;save();render();}break;
    case 'task':x=find(S.tasks,d.id);if(x){x.done=el.checked;save();render();}break;
    case 'habit':{const t=today(),a=S.hlog[t]||[];S.hlog[t]=el.checked?a.concat([d.id]).filter((v,i,r)=>r.indexOf(v)===i):a.filter(v=>v!==d.id);save();render();break;}
    case 'exam':S.examDate=el.value;save();render();break;
    case 'goal':{const g=parseFloat(el.value);if(g>0){S.goalMins=Math.round(g*60);save();render();}break;}
    case 'target':{const g=parseInt(el.value,10);S.targetScore=g>0&&g<=300?String(g):'';save();render();break;}
    case 'planstart':if(el.value){S.planStart=el.value;save();render();}break;
    case 'tmin':{const m=clamp(parseInt(el.value,10)||25,1,240);T.mins=m;if(!T.running&&T.mode==='focus')T.left=tLen();render();break;}
    case 'tchap':T.chap=el.value;break;
    case 'tnote':T.note=el.value;break;
    case 'prio':setMeta(ALLC[+d.ci].n,{prio:el.value});save();render();break;
    case 'cnotes':setMeta(ALLC[+d.ci].n,{notes:el.value});save();break;
    case 'sylst':sylSt=el.value;render();break;
    case 'sylpr':sylPr=el.value;render();break;
    case 'mfs':mfS=el.value;render();break;
    case 'mfc':mfC=el.value;render();break;
    case 'mft':mfT=el.value;render();break;
    case 'tday':if(el.value){tDay=el.value;render();}break;
    case 'student':S.student=el.value.trim();save();break;
    case 'import':{const f=el.files&&el.files[0];if(!f)break;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(String(r.result));if(!o||typeof o!=='object'||!Array.isArray(o.backlog))throw new Error('bad');importPending=o;}catch(err){importPending=null;toast('That file is not a Prep Desk backup');}render();};r.readAsText(f);break;}
  }
});
view.addEventListener('input',e=>{
  const el=e.target.closest('[data-input]');if(!el)return;
  if(el.dataset.input==='sq'){sylQ=el.value;const l=$('#syl-list');if(l)l.innerHTML=sylRows();}
  else if(el.dataset.input==='nq'){noteQ=el.value;const l=$('#note-list');if(l)l.innerHTML=noteCards();}
  else if(el.dataset.input==='cdraft')coachDraft=el.value;
});
view.addEventListener('submit',e=>{
  e.preventDefault();const k=e.target.dataset.form;
  if(k==='task'){const tx=v$('f-task-text').trim();if(!tx)return;S.tasks.push({id:uid(),text:tx,subj:v$('f-task-subj'),due:v$('f-task-due'),done:false,pri:false});}
  else if(k==='backlog'){const nm=v$('f-bl-name').trim();if(!nm)return;const c=ALLC.find(a=>a.n.toLowerCase()===nm.toLowerCase());S.backlog.push(mk(c?c.n:nm,c?c.s:v$('f-bl-subj'),c&&!blFor(c.n)?c.n:'',+v$('f-bl-day')));}
  else if(k==='habit'){const nm=v$('f-habit').trim();if(!nm)return;S.habits.push({id:uid(),name:nm});}
  else if(k==='test'){const p=parseInt(v$('f-test-p'),10),c=parseInt(v$('f-test-c'),10),m=parseInt(v$('f-test-m'),10);if([p,c,m].some(isNaN))return;S.tests.push({id:uid(),date:v$('f-test-date'),name:v$('f-test-name').trim()||('Mock '+(S.tests.length+1)),p:p,c:c,m:m,note:v$('f-test-note').trim(),at:Date.now()});}
  else if(k==='mist'){const tx=v$('f-m-text').trim();if(!tx)return;S.mistakes.push({id:uid(),date:today(),subj:v$('f-m-subj'),chap:v$('f-m-chap').trim(),cause:v$('f-m-cause'),source:v$('f-m-src'),text:tx,fix:v$('f-m-fix').trim(),status:'open'});}
  else if(k==='rev'){const n=v$('f-rev-ch'),due=v$('f-rev-due');if(!n||!due)return;S.rev.push({id:uid(),name:n,subj:subjOf(n),due:due,n:S.rev.filter(r=>r.name===n).length+1,done:false});}
  else if(k==='block'){const a=v$('f-b-start'),b=v$('f-b-end');if(!a||!b||toMin(b)<=toMin(a)){toast('The end time must be after the start time');return;}S.blocks.push({id:uid(),day:+v$('f-b-day'),start:a,end:b,subj:v$('f-b-subj'),label:v$('f-b-label').trim(),sample:false});}
  else if(k==='note'){const ti=v$('f-n-title').trim(),bo=v$('f-n-body').trim();if(!ti||!bo)return;const ex=find(S.notes,editNote);if(ex){ex.title=ti;ex.body=bo;ex.subj=v$('f-n-subj');editNote='';}else S.notes.push({id:uid(),title:ti,body:bo,subj:v$('f-n-subj'),pin:false,at:Date.now()});}
  else if(k==='manual'){const mn=parseInt(v$('f-ms-min'),10);if(!(mn>0))return;const dt=v$('f-ms-date')||today();S.sessions.push({id:uid(),date:dt,subj:v$('f-ms-subj'),mins:mn,at:parseYmd(dt).getTime()+12*36e5,chap:v$('f-ms-chap').trim(),note:'',dist:0});toast('Logged '+fmtMin(mn));}
  else if(k==='qlog'){
    const cnt=parseInt(v$('f-q-count'),10);if(!(cnt>0))return;
    const cr=v$('f-q-correct').trim(),cor=cr===''?null:parseInt(cr,10);
    if(cor!==null&&(isNaN(cor)||cor<0||cor>cnt)){toast('Correct answers must be between 0 and the number solved');return;}
    const dt=v$('f-q-date')||today();
    S.qlog.push({id:uid(),date:dt,subj:v$('f-q-subj'),chap:v$('f-q-chap').trim(),count:cnt,correct:cor,note:v$('f-q-note').trim(),at:Date.now()});
    tDay=dt;toast('Logged '+cnt+' questions');
  }
  else return;
  save();render();
});
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const tg=e.target&&e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT')return;
  const i='1234567890'.indexOf(e.key);
  if(i>=0&&TABS[i]){setTab(TABS[i][0]);return;}
  if(e.key==='t'&&tab==='study'){if(T.running){T.left=tLeft();T.running=false;lockScreen(false);}else{if(T.left<=0)T.left=tLen();T.end=Date.now()+T.left*1000;T.running=true;lockScreen(true);}render();}
});

applyTheme();render();setSync('Loading...');

/* durable storage: two private per-viewer documents (core state, logs); browser storage is the fallback */
(async function(){
  try{
    if(!window.claude||!window.claude.use){setSync('Saved in this browser only');return;}
    const [user,db,smp,dl]=await Promise.all([window.claude.use('user'),window.claude.use('db'),window.claude.use('sample'),window.claude.use('downloads')]);
    SAMPLE=smp||null;DL=dl||null;if(tab==='coach'||tab==='data'||tab==='mistakes'||tab==='teacher')render();
    const id=user?await user.id():null;
    if(!db||!id){setSync('Saved in this browser only');return;}
    refA=db.doc('data/users/'+id+'/state');refB=db.doc('data/users/'+id+'/logs');
    const [sa,sb]=await Promise.all([refA.get(),refB.get()]);
    const da=sa.exists?sa.data():null,dbb=sb.exists?sb.data():null;
    if(da&&da.s){
      const merged=Object.assign({},da.s,dbb&&dbb.s?dbb.s:{});
      if(!dbb||!dbb.s){if(Array.isArray(da.s.sessions))merged.sessions=da.s.sessions;if(Array.isArray(da.s.notes))merged.notes=da.s.notes;if(Array.isArray(da.s.qlog))merged.qlog=da.s.qlog;}
      S=norm(merged);try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
      const parts=splitState();lastA=JSON.stringify(parts[0]);lastB=JSON.stringify(parts[1]);
      applyTheme();render();setSync('Saved to your account');
    }else{await flush();}
  }catch(e){refA=null;refB=null;setSync('Saved in this browser only');}
})();
})();
